apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: enterprise-rag
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/enterprise-rag/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          env:
            - name: LITELLM_PROXY_URL
              value: "http://litellm:4000"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://raguser:$(DB_PASSWORD)@$(RDS_ENDPOINT):5432/enterprise_rag"
            - name: REDIS_URL
              value: "redis://$(REDIS_ENDPOINT):6379/0"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: enterprise-rag
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
