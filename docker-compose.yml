services:
  # ---- Frontend ----
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

  # ---- Backend API ----
  backend: &backend-common
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - rag_storage:/tmp/rag-storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
      litellm:
        condition: service_started
    env_file:
      - .env
    environment: &backend-env
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-enterprise_rag}
      - LITELLM_PROXY_URL=http://litellm:4000
      - QDRANT_HOST=qdrant
      - REDIS_URL=redis://redis:6379/0
      # Qdrant Cloud (leave empty for self-hosted)
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      # OCR provider: local | aws_textract | azure_di | google_docai | auto
      - OCR_PROVIDER=${OCR_PROVIDER:-local}
      # AWS (LiteLLM + Textract + S3)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Azure Document Intelligence
      - AZURE_DI_ENDPOINT=${AZURE_DI_ENDPOINT:-}
      - AZURE_DI_KEY=${AZURE_DI_KEY:-}
      # Google Document AI
      - GOOGLE_DOCAI_PROCESSOR=${GOOGLE_DOCAI_PROCESSOR:-}
      # Object storage: local | s3 | gcs | azure_blob
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      # Background processing
      - USE_CELERY=${USE_CELERY:-false}
      # Auth
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - API_KEYS=${API_KEYS:-}
      # Reranking
      - RERANK_MODEL=${RERANK_MODEL:-}
      # OpenTelemetry
      - OTEL_EXPORTER_ENDPOINT=${OTEL_EXPORTER_ENDPOINT:-}
      # Langfuse (LLM observability)
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}

  # ---- Celery Worker (background document processing) ----
  worker:
    <<: *backend-common
    ports: []
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=2"]
    profiles:
      - celery

  # ---- LiteLLM Proxy ----
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started

  # ---- Qdrant Vector DB ----
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-enterprise_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  qdrant_data:
  pgdata:
  redis_data:
  rag_storage:
